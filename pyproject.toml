[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillsync"
version = "0.1.0"
description = "Mirror upstream skill repos, security-scan changes, and agentically adapt them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
skillsync = "skillsync.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["skillsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
